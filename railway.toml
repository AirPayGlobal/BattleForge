# ─── BattleForge — Railway deployment config ──────────────────────────────────
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder        = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"

# Pass Supabase public keys into the Vite client build.
# Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY in Railway Variables.
[build.args]
VITE_SUPABASE_URL             = "${{VITE_SUPABASE_URL}}"
VITE_SUPABASE_PUBLISHABLE_KEY = "${{VITE_SUPABASE_PUBLISHABLE_KEY}}"

[deploy]
healthcheckPath         = "/api/health"
healthcheckTimeout      = 120
restartPolicyType       = "ON_FAILURE"
restartPolicyMaxRetries = 3
